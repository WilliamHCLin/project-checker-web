<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理後台 — William</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }</style>
</head>
<body class="bg-gray-900 min-h-screen text-white">

<header class="bg-gray-800 px-6 py-4 flex items-center justify-between border-b border-gray-700">
  <h1 class="text-xl font-bold">🔐 管理後台 — William</h1>
  <a href="/" class="text-gray-400 hover:text-white text-sm">← 回首頁</a>
</header>

<!-- 登入區 -->
<div id="loginArea" class="max-w-sm mx-auto mt-20 bg-gray-800 rounded-2xl p-8 shadow-xl">
  <h2 class="text-lg font-bold mb-6 text-center">輸入管理員 Token</h2>
  <input id="tokenInput" type="password" placeholder="Admin Token"
    class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 mb-4 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
  <button onclick="login()"
    class="w-full bg-indigo-700 hover:bg-indigo-600 py-2 rounded-lg font-bold transition">登入</button>
  <p id="loginError" class="text-red-400 text-sm mt-3 hidden text-center">Token 錯誤</p>
</div>

<!-- 管理內容 -->
<div id="adminContent" class="hidden max-w-5xl mx-auto px-4 py-8">

  <!-- 操作列 -->
  <div class="flex gap-4 mb-8 flex-wrap">
    <button onclick="loadHistory()"
      class="bg-indigo-700 hover:bg-indigo-600 px-5 py-2 rounded-lg font-bold text-sm transition">
      🔄 載入記錄
    </button>
    <button onclick="reloadDb()"
      class="bg-amber-600 hover:bg-amber-500 px-5 py-2 rounded-lg font-bold text-sm transition">
      ♻️ 重新載入資料庫
    </button>
    <a href="/health" target="_blank"
      class="bg-gray-700 hover:bg-gray-600 px-5 py-2 rounded-lg font-bold text-sm transition">
      🩺 系統狀態
    </a>
  </div>

  <div id="dbStatus" class="hidden bg-green-800 rounded-lg px-4 py-2 mb-4 text-sm"></div>

  <!-- 記錄表格 -->
  <div class="bg-gray-800 rounded-2xl overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-700 flex items-center justify-between">
      <h2 class="font-bold">📋 所有檢核記錄</h2>
      <span id="recordCount" class="text-gray-400 text-sm"></span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-700 text-gray-300">
          <tr>
            <th class="px-4 py-3 text-left">日期</th>
            <th class="px-4 py-3 text-left">Member</th>
            <th class="px-4 py-3 text-left">場景</th>
            <th class="px-4 py-3 text-center">層級</th>
            <th class="px-4 py-3 text-center">評分</th>
            <th class="px-4 py-3 text-center">結果</th>
            <th class="px-4 py-3 text-left">操作</th>
          </tr>
        </thead>
        <tbody id="historyBody" class="divide-y divide-gray-700"></tbody>
      </table>
      <div id="emptyMsg" class="hidden text-center py-10 text-gray-500">尚無記錄，請先載入</div>
    </div>
  </div>
</div>

<script>
let adminToken = localStorage.getItem('adminToken') || '';
if (adminToken) tryAutoLogin();

function login() {
  adminToken = document.getElementById('tokenInput').value.trim();
  tryAutoLogin();
}

async function tryAutoLogin() {
  const resp = await fetch('/api/admin/history', {
    headers: { 'X-Admin-Token': adminToken }
  });
  if (resp.ok) {
    localStorage.setItem('adminToken', adminToken);
    document.getElementById('loginArea').classList.add('hidden');
    document.getElementById('adminContent').classList.remove('hidden');
    const data = await resp.json();
    renderHistory(data);
  } else {
    document.getElementById('loginError').classList.remove('hidden');
    localStorage.removeItem('adminToken');
  }
}

async function loadHistory() {
  const resp = await fetch('/api/admin/history', {
    headers: { 'X-Admin-Token': adminToken }
  });
  if (resp.ok) renderHistory(await resp.json());
}

function renderHistory(records) {
  const body = document.getElementById('historyBody');
  document.getElementById('recordCount').textContent = `共 ${records.length} 筆`;
  document.getElementById('emptyMsg').classList.toggle('hidden', records.length > 0);
  body.innerHTML = '';
  records.forEach(r => {
    const passed = r.passed;
    const scoreClass = passed ? 'text-green-400 font-bold' : 'text-red-400 font-bold';
    body.innerHTML += `
      <tr class="hover:bg-gray-750 transition">
        <td class="px-4 py-3 text-gray-300">${(r.timestamp||'').slice(0,10)}</td>
        <td class="px-4 py-3">${r.member_name || '—'}</td>
        <td class="px-4 py-3 text-gray-300 text-xs max-w-xs truncate">${r.scene || '—'}</td>
        <td class="px-4 py-3 text-center">
          <span class="bg-gray-700 px-2 py-0.5 rounded text-xs">${r.level || '—'}</span>
        </td>
        <td class="px-4 py-3 text-center ${scoreClass}">${r.score}</td>
        <td class="px-4 py-3 text-center">
          ${passed ? '<span class="text-green-400">✅ 達標</span>' : '<span class="text-red-400">❌ 未達標</span>'}
        </td>
        <td class="px-4 py-3 flex gap-2">
          <a href="/api/report/${r.check_id}/word" class="text-indigo-400 hover:underline text-xs">Word</a>
          <a href="/api/report/${r.check_id}/html" target="_blank" class="text-gray-400 hover:underline text-xs">HTML</a>
        </td>
      </tr>`;
  });
}

async function reloadDb() {
  const resp = await fetch('/api/admin/reload-db', {
    method: 'POST',
    headers: { 'X-Admin-Token': adminToken }
  });
  const data = await resp.json();
  const el = document.getElementById('dbStatus');
  el.textContent = data.message || '完成';
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3000);
}
</script>
</body>
</html>
